<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raasa Harvest — Premium Fresh Catalogue</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Jost:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── RESET & BASE ── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --burg:   #3b0d0d;   --burg2:  #5c1a1a;   --burg3:  #7d2d2d;
  --saffron:#c8860a;   --saff2:  #e8a020;   --saff3:  #f5d98a;   --saff4:  #fdf6e3;
  --forest: #1e3a2f;   --fern:   #3a6b50;   --sage:   #6a9e7f;
  --mint:   #c2dfd1;   --mintbg: #eef7f2;
  --spice:  #8b3a0f;   --spice2: #d4601a;   --spice3: #fce8da;
  --ivory:  #faf6ee;   --ivory2: #f2ebe0;
  --wh:     #ffffff;   --td:     #1a0a0a;   --tm:     #4a2020;   --tl:     #9a7070;
  --card:   #fffcf7;
}

body {
  font-family: 'Jost', sans-serif;
  background: var(--ivory2);
  color: var(--td);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── NAV ── */
.nav {
  position: fixed; top:0; left:0; right:0; z-index:200;
  height: auto; min-height: 64px;
  background: var(--burg);
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 5vw;
  box-shadow: 0 2px 24px rgba(59,13,13,.5);
  border-bottom: 1px solid rgba(200,134,10,.25);
  flex-wrap: wrap; gap: 10px;
}
.nav-logo { display: flex; flex-direction: column; line-height: 1; }
.nav-logo-main { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 600; font-style: italic; color: var(--saff3); letter-spacing: 1px; }
.nav-logo-sub { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 4px; text-transform: uppercase; color: rgba(200,134,10,.6); margin-top: 1px; }
.nav-tabs { display:flex; gap:5px; overflow-x: auto; white-space: nowrap; padding-bottom: 4px; }
.nav-tabs::-webkit-scrollbar { height: 0px; }
.nav-tab { padding: 8px 16px; border-radius: 4px; font-size: 0.75rem; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: rgba(245,217,138,.7); background: transparent; border: none; cursor: pointer; transition: all .2s; }
.nav-tab:hover  { background: rgba(200,134,10,.12); color: var(--saff3); }
.nav-tab.active { background: var(--saffron); color: var(--burg); font-weight: 600; }

/* ── PAGES ── */
.page { display:none; padding-top: 80px; }
.page.active { display:block; animation: fadeUp .4s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* ── PROFILE MODAL STYLE ── */
.profile-container { max-width: 600px; margin: 20px auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.field-group { margin-bottom: 20px; }
.field-label { display: block; font-weight: 500; margin-bottom: 8px; color: var(--burg); }
.field-input { width: 100%; padding: 12px; border: 1px solid var(--mint); border-radius: 6px; font-family: 'Jost', sans-serif; }
.btn-save { background: var(--saffron); color: var(--wh); border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; transition: background 0.3s; }
.btn-save:hover { background: var(--saff2); }
.btn-save:disabled { background: #ccc; cursor: not-allowed; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">
    <div class="nav-logo-main">Raasa Harvest</div>
    <div class="nav-logo-sub">Hyderabad</div>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active">Profile</button>
  </div>
</nav>

<div class="page active">
  <div class="profile-container">
    <h2 style="margin-bottom: 20px; font-family: 'Cormorant Garamond'; color: var(--burg);">Customer Profile</h2>
    
    <div class="field-group">
      <label class="field-label" for="edName">Full Name</label>
      <input class="field-input" type="text" id="edName" name="Customer_Name" placeholder="Enter your name">
    </div>
    <div class="field-group">
      <label class="field-label" for="edPhone">WhatsApp No.</label>
      <input class="field-input" type="text" id="edPhone" name="WhatsApp_Number" placeholder="91XXXXXXXXXX">
    </div>
    <div class="field-group">
      <label class="field-label" for="edEmail">Email Address</label>
      <input class="field-input" type="email" id="edEmail" name="Email" placeholder="your@email.com">
    </div>
    <div class="field-group">
      <label class="field-label" for="edAddr">Delivery Address</label>
      <textarea class="field-input" id="edAddr" name="Address" rows="3" placeholder="Street, Area, Landmark, Hyderabad"></textarea>
    </div>

    <button class="btn-save" id="saveBtn" onclick="sendDataToSheet()">Save Changes</button>
  </div>
</div>

<script>
  /**
   * 1. PASTE YOUR DEPLOYED WEB APP URL HERE
   * You get this after clicking "Deploy > New Deployment" in Google Apps Script.
   */
  const scriptURL = 'https://script.google.com/macros/s/AKfycbzOhL8Tm-S-L3qYlQ6RzSpbw5P36_9iuF_mEBfzw2ZwRqaf1SrrNJA_j7JOW7VsLTkp9w/exec';

  function sendDataToSheet() {
    const saveBtn = document.getElementById('saveBtn');
    const name = document.getElementById('edName').value;
    const phone = document.getElementById('edPhone').value;
    const email = document.getElementById('edEmail').value;
    const address = document.getElementById('edAddr').value;

    // Basic Validation
    if (!name || !phone) {
      alert("Please fill in your Name and WhatsApp Number.");
      return;
    }

    saveBtn.innerHTML = "Saving...";
    saveBtn.disabled = true;

    // Prepare data to match your Google Sheet headers
    const formData = new FormData();
    formData.append('Customer_Name', name);
    formData.append('WhatsApp_Number', phone);
    formData.append('Email', email);
    formData.append('Address', address);

    // Send data to Google Apps Script
    fetch(scriptURL, { method: 'POST', body: formData })
      .then(response => {
        alert('Success! Your details have been saved to Raasa Harvest.');
        saveBtn.innerHTML = "Save Changes";
        saveBtn.disabled = false;
      })
      .catch(error => {
        console.error('Error!', error.message);
        alert('Error saving data. Please check your connection or Script URL.');
        saveBtn.innerHTML = "Save Changes";
        saveBtn.disabled = false;
      });
  }
</script>

</body>
</html>
